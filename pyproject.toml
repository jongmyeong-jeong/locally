[build-system]
requires = ["hatchling>=1.24", "hatch-build-scripts>=0.0.4"]
build-backend = "hatchling.build"

[project]
name = "locally"
version = "0.1.0"
description = "로컬 음성 전사 + 회의록 요약 (CLI + Local Web)"
requires-python = ">=3.10"
authors = [{ name = "jongmyeong" }]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "huggingface_hub>=0.24",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "mlx-whisper>=0.4; sys_platform == 'darwin'",
  "faster-whisper>=1.0; sys_platform != 'darwin'",
  "rich>=13.0",
  "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[project.scripts]
locally = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/static" = "app/static"

[[tool.hatch.build.hooks.build-scripts.scripts]]
out_dir = "app/static"
commands = [
  "corepack enable pnpm || true",
  "cd web && pnpm install --frozen-lockfile && pnpm build",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
