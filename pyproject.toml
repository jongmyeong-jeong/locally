[build-system]
requires = ["hatchling>=1.24", "hatch-build-scripts>=0.0.4"]
build-backend = "hatchling.build"

[project]
name = "locally"
version = "0.1.1"
description = "음성 녹음 + Groq 전사 (CLI + Local Web)"
requires-python = ">=3.11"
authors = [{ name = "jongmyeong" }]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "groq>=0.12",
  "numpy>=1.26",
  "scipy>=1.12",
  "python-multipart>=0.0.9",
  "rich>=13.0",
  "packaging>=21.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.15.11",
]

[project.scripts]
locally = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/static" = "app/static"

[[tool.hatch.build.hooks.build-scripts.scripts]]
out_dir = "app/static"
commands = [
  "corepack enable pnpm || true",
  "cd web && pnpm install --frozen-lockfile && pnpm build",
]

